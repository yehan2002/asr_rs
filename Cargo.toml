[package]
name = "asr_rs"
version = "0.1.0"
edition = "2024"

[features]
bindgen=[]
model_download=["dep:indicatif", "dep:ureq"]
default=["model_download", ]

[dependencies]
colored = "3.1.1"
cpal = {version="0.17.1"}
hound = "3.5.1"
indicatif = {version="0.18.4",optional=true}
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
ureq = { version = "3.2.0", optional = true }
whisper-rs = {version="0.15.1", features=["cuda"]}
